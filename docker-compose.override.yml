# Override para desarrollo local — hot-reload habilitado
# Este archivo se aplica automaticamente con `docker compose up`
# En produccion: `docker compose -f docker-compose.yml up` (sin override)
services:
  backend:
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
