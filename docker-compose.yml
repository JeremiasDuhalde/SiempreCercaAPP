services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: siemprecerca_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siemprecerca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siemprecerca_dev}
      POSTGRES_DB: ${POSTGRES_DB:-siemprecerca}
    volumes:
      - siemprecerca_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: siemprecerca_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: siemprecerca_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8300:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/media:/app/media
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: siemprecerca_worker
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: siemprecerca_beat
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: ["uv", "run", "celery", "-A", "app.celery_app", "beat", "--loglevel=info"]

  frontend:
    build: ./frontend
    container_name: siemprecerca_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5176:80"

  nginx:
    image: nginx:alpine
    container_name: siemprecerca_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend

volumes:
  siemprecerca_db_data:
