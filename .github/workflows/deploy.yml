name: Deploy Web App

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "PROCESO_OPERATIVO.md"
      - "PROYECTO_ODOO.md"
      - ".github/**"
      - "!.github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/siemprecerca
  DOMAIN: app.siemprecercasrl.net
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jeremiasduhalde/siemprecerca

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag de imagen
        id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build y push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build y push worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-worker:latest

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::Secrets SSH no configurados (SSH_KEY, SSH_HOST, SSH_USER)"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_CMD=ssh -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST}" >> "$GITHUB_ENV"
          echo "SCP_CMD=scp -i ~/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Crear tarball (configs y archivos no-Docker)
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='backend/.env' \
            --exclude='*.pyc' \
            --exclude='.mypy_cache' \
            --exclude='.ruff_cache' \
            --exclude='.pytest_cache' \
            --exclude='backups' \
            --exclude='nginx/certbot' \
            --exclude='docker-compose.override.yml' \
            .
          mv /tmp/deploy.tar.gz .

      - name: Subir tarball al servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          $SCP_CMD deploy.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/deploy.tar.gz"

      - name: Deploy en servidor
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          $SSH_CMD << REMOTE
            set -e
            cd /opt/siemprecerca

            echo "=== Backup .env files ==="
            TS=\$(date +%s)
            cp .env ".env.backup.\${TS}" 2>/dev/null || true
            cp backend/.env "backend/.env.backup.\${TS}" 2>/dev/null || true
            ls -t .env.backup.* 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true
            ls -t backend/.env.backup.* 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true

            echo "=== Extraer tarball ==="
            tar xzf /tmp/deploy.tar.gz --overwrite
            rm /tmp/deploy.tar.gz

            echo "=== Login a GHCR ==="
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "=== Pull imagenes ==="
            export IMAGE_TAG="${IMAGE_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "=== Levantar servicios ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "=== Restart nginx para resolver IPs nuevas ==="
            docker compose restart nginx
          REMOTE

      - name: Migraciones
        run: |
          $SSH_CMD << 'REMOTE'
            set -e
            cd /opt/siemprecerca

            echo "=== Esperando backend ==="
            for i in $(seq 1 12); do
              if docker compose exec -T backend uv run python -c "print('ready')" 2>/dev/null | grep -q ready; then
                echo "Backend listo en intento $i"
                break
              fi
              echo "Intento $i/12 - esperando..."
              sleep 5
            done

            echo "=== Ejecutando migraciones ==="
            docker compose exec -T backend uv run alembic upgrade head 2>&1
            echo "Migraciones completadas"
          REMOTE

      - name: Health check post-deploy
        run: |
          echo "=== Health check API ==="
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /tmp/health_response -w "%{http_code}" --max-time 10 "https://${DOMAIN}/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "API OK (intento $i): $(cat /tmp/health_response)"
              break
            fi
            echo "Intento $i/12 - HTTP $HTTP_CODE, esperando 15s..."
            sleep 15
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::API no responde despues de 12 intentos (3 min)"
            exit 1
          fi

          echo "=== Health check Frontend ==="
          FRONTEND_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "https://${DOMAIN}/" 2>/dev/null || echo "000")
          if [ "$FRONTEND_CODE" = "200" ]; then
            echo "Frontend OK: HTTP $FRONTEND_CODE"
          else
            echo "::warning::Frontend respondio HTTP $FRONTEND_CODE"
          fi

      - name: Estado de servicios
        if: always()
        run: |
          $SSH_CMD << 'REMOTE'
            cd /opt/siemprecerca
            docker compose ps --format "table {{.Name}}\t{{.Status}}" 2>/dev/null || true
          REMOTE

      - name: Step summary
        if: always()
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Deploy a produccion

          | Campo | Valor |
          |-------|-------|
          | **VM** | \`${{ secrets.SSH_HOST }}\` |
          | **URL** | https://${DOMAIN} |
          | **Commit** | \`${{ github.sha }}\` |
          | **Image tag** | \`${IMAGE_TAG}\` |
          | **Actor** | ${{ github.actor }} |
          | **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | **Ref** | \`${{ github.ref_name }}\` |
          EOF

      - name: Limpiar SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
